name: Build Artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HOST_ABI: "1"

jobs:
  quality:
    name: Runtime quality gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.runtime_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: ohos/test/package-lock.json

      - name: Install quality dependencies
        run: |
          if [ -f pubspec_overrides.yaml ]; then
            mv pubspec_overrides.yaml "$RUNNER_TEMP/pubspec_overrides.yaml.disabled"
          fi
          flutter pub get
          npm ci --ignore-scripts --prefix ohos/test

      - name: Analyze
        run: flutter analyze

      - name: Test shared game bridge
        run: |
          node tool/check_game_bridge.mjs
          node tool/check_export_download_patch.mjs
          node tool/check_audio_diagnostic.mjs
          node tool/check_auto_sun.mjs
          node tool/check_touch_state_machine.mjs
          node tool/check_touch_patch.mjs
          node tool/check_native_gestures.mjs
          node tool/check_gamepad.mjs
          node tool/check_game_feedback.mjs
          node tool/check_render_scale.mjs
          node tool/check_audio_lifecycle.mjs

      - name: Test OHOS file protocol in memory
        run: npm test --prefix ohos/test

      - name: Record runtime version
        id: runtime_version
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: quality
    outputs:
      version: ${{ steps.android_artifact.outputs.version }}
      sha256: ${{ steps.android_artifact.outputs.sha256 }}
      host_abi: ${{ steps.android_artifact.outputs.host_abi }}
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install dependencies
        run: |
          if [ -f pubspec_overrides.yaml ]; then
            mv pubspec_overrides.yaml "$RUNNER_TEMP/pubspec_overrides.yaml.disabled"
          fi
          flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
          else
            echo "::error::Android signing secrets are not configured; release APKs are never debug-signed."
            exit 1
          fi

      - name: Compute Android version code
        id: android_version
        shell: bash
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number "${{ steps.android_version.outputs.version_code }}"

      - name: Test retained and pure Android behavior
        working-directory: android
        run: |
          test -x ./gradlew
          ./gradlew :app:testReleaseUnitTest \
            --tests io.github.dey410.gardendlessloader.game.FileTransferCursorTest \
            --tests io.github.dey410.gardendlessloader.game.FileCommitGateTest \
            --tests io.github.dey410.gardendlessloader.game.FileTransferRetainedFixtureTest \
            --tests io.github.dey410.gardendlessloader.game.GameResourceRetainedFixtureTest \
            --tests io.github.dey410.gardendlessloader.game.ExportDocumentSpecTest \
            --tests io.github.dey410.gardendlessloader.game.GpNextPathContractTest \
            --tests io.github.dey410.gardendlessloader.game.GameViewportSizeTest \
            --tests io.github.dey410.gardendlessloader.DocumentPickerOrientationPolicyTest

      - name: Verify APK version
        run: |
          EXPECTED_VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          ACTUAL_VERSION="$(
            "$AAPT_PATH" dump badging build/app/outputs/flutter-apk/app-release.apk |
              sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p"
          )"
          echo "Expected APK version: $EXPECTED_VERSION"
          echo "Actual APK version: $ACTUAL_VERSION"
          test -n "$ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Stage APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/GardendlessLoader-android.apk

      - name: Summarize APK
        id: android_artifact
        run: |
          ARTIFACT="build/app/outputs/flutter-apk/GardendlessLoader-android.apk"
          test -s "$ARTIFACT"
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          SHA256="$(sha256sum "$ARTIFACT" | cut -d' ' -f1)"
          test -n "$VERSION"
          test "${#SHA256}" -eq 64
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "host_abi=$HOST_ABI" >> "$GITHUB_OUTPUT"
          {
            echo "### APK"
            echo "- version: $VERSION"
            echo "- hostAbi: $HOST_ABI"
            echo "- SHA-256: $SHA256"
            echo "- artifact: $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/GardendlessLoader-android.apk
          if-no-files-found: error
          archive: false

  ios:
    needs: quality
    outputs:
      version: ${{ steps.ios_artifact.outputs.version }}
      sha256: ${{ steps.ios_artifact.outputs.sha256 }}
      host_abi: ${{ steps.ios_artifact.outputs.host_abi }}
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install dependencies
        run: |
          if [ -f pubspec_overrides.yaml ]; then
            mv pubspec_overrides.yaml "$RUNNER_TEMP/pubspec_overrides.yaml.disabled"
          fi
          flutter pub get

      - name: Test native GardendlessKit
        run: |
          CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/gardendless-clang" \
          SWIFTPM_MODULECACHE_OVERRIDE="$RUNNER_TEMP/gardendless-clang" \
          swift test --disable-sandbox \
            --package-path ios/GardendlessKit \
            --scratch-path "$RUNNER_TEMP/gardendless-swift" \
            --cache-path "$RUNNER_TEMP/gardendless-spm" \
            --filter 'FileTaskCoordinatorTests|TaskCallbackGateTests|BridgeRequestTests|GameConfigurationTests|GameSessionTests|ConstantsTests|ReservedMetadataPathsTests|ResourceMIMETests'

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify IPA version
        run: |
          EXPECTED_VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          ACTUAL_VERSION="$(plutil -extract CFBundleShortVersionString raw build/ios/iphoneos/Runner.app/Info.plist)"
          echo "Expected IPA version: $EXPECTED_VERSION"
          echo "Actual IPA version: $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r GardendlessLoader-unsigned.ipa Payload

      - name: Summarize unsigned IPA
        id: ios_artifact
        run: |
          ARTIFACT="build/ios/ipa/GardendlessLoader-unsigned.ipa"
          test -s "$ARTIFACT"
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          SHA256="$(shasum -a 256 "$ARTIFACT" | cut -d' ' -f1)"
          test -n "$VERSION"
          test "${#SHA256}" -eq 64
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "host_abi=$HOST_ABI" >> "$GITHUB_OUTPUT"
          {
            echo "### unsigned IPA"
            echo "- version: $VERSION"
            echo "- hostAbi: $HOST_ABI"
            echo "- SHA-256: $SHA256"
            echo "- artifact: $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/ios/ipa/GardendlessLoader-unsigned.ipa
          if-no-files-found: error
          archive: false

  harmonyos:
    needs: quality
    outputs:
      version: ${{ steps.harmonyos_artifact.outputs.version }}
      sha256: ${{ steps.harmonyos_artifact.outputs.sha256 }}
      host_abi: ${{ steps.harmonyos_artifact.outputs.host_abi }}
    name: Build unsigned HarmonyOS HAP (ohos-arm64)
    runs-on: ubuntu-latest

    env:
      OHOS_FLUTTER_SDK_REPOSITORY: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      OHOS_FLUTTER_SDK_BRANCH: oh-3.35.7-release
      OHOS_FLUTTER_SDK_REVISION: add49ea449c07c6e9a4bcfe7c03f2169fc15cd2b
      OHOS_MIN_DART_VERSION: 3.5.0
      OHOS_COMMANDLINE_TOOLS_URL: ${{ secrets.OHOS_COMMANDLINE_TOOLS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenHarmony tools configuration
        run: |
          if [ -z "$OHOS_COMMANDLINE_TOOLS_URL" ]; then
            echo "::error::OHOS_COMMANDLINE_TOOLS_URL secret is required for the maintained HarmonyOS build."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up OpenHarmony Flutter SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          git clone \
            --branch "$OHOS_FLUTTER_SDK_BRANCH" \
            "$OHOS_FLUTTER_SDK_REPOSITORY" \
            "$FLUTTER_OHOS_DIR"

          cd "$FLUTTER_OHOS_DIR"

          git fetch --tags --force
          git checkout --detach "$OHOS_FLUTTER_SDK_REVISION"
          test "$(git rev-parse HEAD)" = "$OHOS_FLUTTER_SDK_REVISION"
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"

          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> "$GITHUB_ENV"
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

          "$FLUTTER_OHOS_DIR/bin/flutter" --version
          "$FLUTTER_OHOS_DIR/bin/dart" --version

      - name: Verify OpenHarmony Dart SDK compatibility
        run: |
          flutter --version
          dart --version

          dart_version="$(
            dart --version 2>&1 |
              sed -E 's/.*Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
          )"

          if [ -z "$dart_version" ]; then
            echo "Could not determine Dart version from OpenHarmony Flutter SDK."
            exit 1
          fi

          echo "Detected Dart SDK version: $dart_version"

          if [ "$(printf '%s\n%s\n' "$OHOS_MIN_DART_VERSION" "$dart_version" | sort -V | head -n 1)" != "$OHOS_MIN_DART_VERSION" ]; then
            echo "OpenHarmony Flutter SDK Dart $dart_version is too old; GardendlessLoader requires Dart >=$OHOS_MIN_DART_VERSION."
            echo "Use a newer OpenHarmony Flutter SDK branch."
            exit 1
          fi

      - name: Set up OpenHarmony command-line tools
        run: |
          DEVECO_DIR="$RUNNER_TEMP/deveco_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          mkdir -p "$DEVECO_DIR"

          curl -fL \
            "$OHOS_COMMANDLINE_TOOLS_URL" \
            -o "$RUNNER_TEMP/deveco-commandline-tools.zip"

          if [ ! -s "$RUNNER_TEMP/deveco-commandline-tools.zip" ]; then
            echo "Downloaded OpenHarmony command-line tools archive is empty."
            exit 1
          fi

          unzip -q \
            "$RUNNER_TEMP/deveco-commandline-tools.zip" \
            -d "$DEVECO_DIR"

          TOOL_HOME="$(
            find "$DEVECO_DIR" \
              -type d \
              -name command-line-tools \
              -print \
              -quit
          )"

          if [ -z "$TOOL_HOME" ]; then
            echo "Could not locate command-line-tools in downloaded archive."
            find "$DEVECO_DIR" -maxdepth 4 -type d | sort
            exit 1
          fi

          OHPM_BIN="$(
            find "$TOOL_HOME" \
              -type f \
              -name ohpm \
              -print \
              -quit
          )"

          HVIGOR_BIN="$(
            find "$TOOL_HOME" \
              -type f \
              \( -name hvigor -o -name hvigorw \) \
              -print \
              -quit
          )"

          NODE_BIN="$(command -v node || true)"

          if [ -z "$OHPM_BIN" ]; then
            echo "Could not locate ohpm in downloaded archive."
            find "$TOOL_HOME" -maxdepth 4 -type f | sort
            exit 1
          fi

          if [ -z "$HVIGOR_BIN" ]; then
            echo "Could not locate hvigor or hvigorw in downloaded archive."
            find "$TOOL_HOME" -maxdepth 4 -type f | sort
            exit 1
          fi

          if [ -z "$NODE_BIN" ]; then
            echo "Could not locate node on runner."
            exit 1
          fi

          OHPM_DIR="$(dirname "$OHPM_BIN")"
          HVIGOR_DIR="$(dirname "$HVIGOR_BIN")"
          NODE_DIR="$(dirname "$NODE_BIN")"

          chmod +x "$OHPM_BIN" "$HVIGOR_BIN"

          mkdir -p "$RUNNER_TEMP/ohos-bin"

          if [ "$(basename "$HVIGOR_BIN")" = "hvigorw" ]; then
            printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$HVIGOR_BIN" > "$RUNNER_TEMP/ohos-bin/hvigor"
            chmod +x "$RUNNER_TEMP/ohos-bin/hvigor"
          fi

          echo "$RUNNER_TEMP/ohos-bin" >> "$GITHUB_PATH"
          echo "$OHPM_DIR" >> "$GITHUB_PATH"
          echo "$HVIGOR_DIR" >> "$GITHUB_PATH"
          echo "$NODE_DIR" >> "$GITHUB_PATH"

          echo "TOOL_HOME=$TOOL_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$TOOL_HOME/sdk" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$TOOL_HOME/sdk" >> "$GITHUB_ENV"

          export PATH="$RUNNER_TEMP/ohos-bin:$OHPM_DIR:$HVIGOR_DIR:$NODE_DIR:$PATH"

          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc

          ohpm --version
          hvigor --version
          node --version

      - name: Install dependencies
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p "$PUB_CACHE"

          cp pubspec_overrides.ohos.yaml pubspec_overrides.yaml

          git lfs install --skip-smudge || true
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f" || true
          git config --global filter.lfs.process "git-lfs filter-process --skip" || true

          flutter --version
          dart --version
          flutter pub get

      - name: Build unsigned HAP
        run: |
          set -euo pipefail
          mkdir -p build/ohos/unsigned
          BUILD_MARKER="$RUNNER_TEMP/hap-build-ohos-arm64.marker"
          touch "$BUILD_MARKER"
          flutter build hap --release --no-codesign --target-platform ohos-arm64
          UNSIGNED_HAP="$(python3 - "$BUILD_MARKER" <<'PYHAP'
          import pathlib
          import sys
          marker = pathlib.Path(sys.argv[1]).stat().st_mtime_ns
          outputs = [p for p in pathlib.Path('ohos/entry/build').rglob('*unsigned*.hap')
                     if p.is_file() and p.stat().st_mtime_ns > marker]
          if len(outputs) != 1:
              raise SystemExit(f'Expected exactly one fresh unsigned arm64 HAP, found {len(outputs)}')
          print(outputs[0])
          PYHAP
          )"
          cp "$UNSIGNED_HAP" build/ohos/unsigned/GardendlessLoader-unsigned-ohos-arm64.hap

      - name: Verify HAP version
        run: |
          EXPECTED_VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          HAP_PATH="build/ohos/unsigned/GardendlessLoader-unsigned-ohos-arm64.hap"
          ACTUAL_VERSION="$(
            unzip -p "$HAP_PATH" pack.info |
              node -e 'const fs = require("fs"); const info = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(info.summary.app.version.name);'
          )"
          echo "Expected HAP version: $EXPECTED_VERSION"
          echo "Actual HAP version: $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Summarize unsigned HarmonyOS HAP
        id: harmonyos_artifact
        run: |
          ARTIFACT="build/ohos/unsigned/GardendlessLoader-unsigned-ohos-arm64.hap"
          test -s "$ARTIFACT"
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          SHA256="$(sha256sum "$ARTIFACT" | cut -d' ' -f1)"
          test -n "$VERSION"
          test "${#SHA256}" -eq 64
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "host_abi=$HOST_ABI" >> "$GITHUB_OUTPUT"
          {
            echo "### unsigned HarmonyOS HAP"
            echo "- version: $VERSION"
            echo "- hostAbi: $HOST_ABI"
            echo "- SHA-256: $SHA256"
            echo "- artifact: $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned HarmonyOS HAP
        uses: actions/upload-artifact@v7
        with:
          path: build/ohos/unsigned/GardendlessLoader-unsigned-ohos-arm64.hap
          if-no-files-found: error
          archive: false

  artifacts:
    name: Require three successful artifacts
    if: always()
    needs: [quality, android, ios, harmonyos]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete release evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          EXPECTED_VERSION: ${{ needs.quality.outputs.version }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_VERSION: ${{ needs.android.outputs.version }}
          ANDROID_SHA256: ${{ needs.android.outputs.sha256 }}
          ANDROID_HOST_ABI: ${{ needs.android.outputs.host_abi }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_VERSION: ${{ needs.ios.outputs.version }}
          IOS_SHA256: ${{ needs.ios.outputs.sha256 }}
          IOS_HOST_ABI: ${{ needs.ios.outputs.host_abi }}
          HARMONYOS_RESULT: ${{ needs.harmonyos.result }}
          HARMONYOS_VERSION: ${{ needs.harmonyos.outputs.version }}
          HARMONYOS_SHA256: ${{ needs.harmonyos.outputs.sha256 }}
          HARMONYOS_HOST_ABI: ${{ needs.harmonyos.outputs.host_abi }}
        run: |
          python3 - <<'PYRELEASE'
          import os
          import re
          errors = []
          version = os.environ['EXPECTED_VERSION']
          if os.environ['QUALITY_RESULT'] != 'success' or not version:
              errors.append('Runtime quality gate did not succeed')
          rows = ['| Platform | Result | Version | hostAbi | SHA-256 |',
                  '| --- | --- | --- | --- | --- |']
          for platform in ['ANDROID', 'IOS', 'HARMONYOS']:
              result = os.environ[f'{platform}_RESULT']
              actual = os.environ[f'{platform}_VERSION']
              abi = os.environ[f'{platform}_HOST_ABI']
              digest = os.environ[f'{platform}_SHA256']
              rows.append(f'| {platform} | {result} | {actual} | {abi} | {digest} |')
              if result != 'success' or actual != version or abi != '1' or not re.fullmatch(r'[a-f0-9]{64}', digest):
                  errors.append(f'{platform} is missing a successful matching artifact')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(rows) + '\n')
          if errors:
              raise SystemExit('; '.join(errors))
          PYRELEASE
